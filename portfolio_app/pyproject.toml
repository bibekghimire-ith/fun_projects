[project]
name = "portfolio-app"
version = "0.1.0"
description = "Self-hostable personal portfolio and blog platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "flask>=3.1,<4.0",
    "flask-sqlalchemy>=3.1,<4.0",
    "flask-migrate>=4.0,<5.0",
    "flask-wtf>=1.2,<2.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "gunicorn>=23.0,<24.0",
    "python-dotenv>=1.0,<2.0",
    "email-validator>=2.2,<3.0",
    "flask-login>=0.6,<0.7",
    "flask-limiter>=3.8,<4.0",
    "argon2-cffi>=23.1,<24.0",
    "markdown>=3.7,<4.0",
    "bleach>=6.1,<7.0",
    "pygments>=2.18,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
    "black>=24.8,<25.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations/"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations"]

# `markdown` and `bleach` ship no inline types and have no stubs packaged
# with this project (adding `types-Markdown`/`types-bleach` as dev
# dependencies was considered and rejected as unnecessary churn for two
# thin wrapper functions in app/services/markdown_service.py - the only
# module that imports them).
[[tool.mypy.overrides]]
module = ["markdown", "bleach"]
ignore_missing_imports = true
follow_untyped_imports = true
