name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy app

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" pip-audit

      - name: pip-audit (runtime + dev dependencies)
        # Non-fatal: findings are reviewed and either upgraded or accepted
        # (with rationale recorded in docs/DECISIONS.md) rather than
        # blocking CI on a vulnerability in a dev-only tool that never
        # ships in the production image - see docs/DECISIONS.md. Remove
        # `continue-on-error` once you want new findings to fail the build.
        run: pip-audit --progress-spinner=off
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub Actions runners have a Docker daemon preinstalled (unlike
      # this project's dev/build sandbox - see
      # docs/IMPLEMENTATION_STATE.md), so this step actually builds and
      # validates the multi-stage Dockerfile on every push/PR even though
      # it could not be exercised locally in this session.
      - name: Build production image
        run: docker build --target runtime -t portfolio-app:ci .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: "postgresql+psycopg://portfolio:portfolio@localhost:5432/portfolio_test"
      TEST_DATABASE_URL: "sqlite:///:memory:"
      FLASK_APP: wsgi.py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run migrations against Postgres
        env:
          APP_ENV: development
        run: flask db upgrade

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing
