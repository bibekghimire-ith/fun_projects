{% extends "themes/_layout.html" %}
{% import "base/_content_components.html" as content %}
{% block content %}
<div class="container theme-{{ theme.key }}-shell">
  <h1 class="visually-hidden">Achievements</h1>
  {% if profile %}
    {{ content.achievement_list(profile.achievements) }}
  {% else %}
    <p class="empty-state">No achievements have been published yet.</p>
  {% endif %}
</div>
{% endblock %}
