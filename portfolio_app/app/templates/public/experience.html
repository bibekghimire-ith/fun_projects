{% extends "themes/_layout.html" %}
{% import "base/_content_components.html" as content %}
{% block content %}
<div class="container theme-{{ theme.key }}-shell">
  <h1 class="visually-hidden">Experience</h1>
  {% if profile %}
    {{ content.experience_list(profile.experiences) }}
  {% else %}
    <p class="empty-state">No experience has been published yet.</p>
  {% endif %}
</div>
{% endblock %}
