# Example Nginx reverse-proxy config for the portfolio app, per
# docs/DEPLOYMENT.md's recommended topology:
#
#   Internet -> Load Balancer/VPS -> Nginx -> Gunicorn -> Flask -> PostgreSQL
#
# This file is documentation/config, not something this repository's CI
# builds or runs (no Docker daemon has been available in this project's
# build sessions - see docs/IMPLEMENTATION_STATE.md). Copy it to your
# Nginx sites-available directory (or mount it into an `nginx:alpine`
# container - see the `proxy` profile in docker-compose.yml) and adjust
# `server_name` / TLS certificate paths for your deployment.
#
# Responsibilities this file gives to Nginx (not duplicated in the app):
# - TLS termination (the app itself only ever speaks plain HTTP to
#   Gunicorn; app/config.py's SESSION_COOKIE_SECURE / ENABLE_HSTS and
#   app/__init__.py's ProxyFix wiring assume this).
# - Forwarding X-Forwarded-Proto/X-Forwarded-For/Host so the app can tell
#   it's being accessed over HTTPS from the real client address (requires
#   TRUST_PROXY_HEADERS=true and PROXY_COUNT=1 in the app's environment -
#   see app/config.py and docs/DECISIONS.md; only enable that when Nginx,
#   which overwrites rather than blindly forwards these headers from the
#   client, is actually the sole entry point).
# - A request-size cap consistent with MEDIA_MAX_UPLOAD_BYTES.
# - Serving :80 solely to redirect to HTTPS + answer ACME/Let's Encrypt
#   HTTP-01 challenges.

upstream portfolio_app {
    # "app" resolves via Docker Compose's internal DNS when Nginx runs as
    # a Compose service on the same network (see the `proxy` profile in
    # docker-compose.yml). Replace with 127.0.0.1:8000 (or wherever
    # Gunicorn is bound) for a standalone Nginx install.
    server app:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Required for Let's Encrypt / other ACME HTTP-01 challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Replace with your real certificate paths (e.g. from certbot).
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Keep this in sync with MEDIA_MAX_UPLOAD_BYTES (app/config.py),
    # default 5 MiB, plus headroom for multipart overhead.
    client_max_body_size 8m;

    # The app itself already sets Content-Security-Policy,
    # X-Content-Type-Options, X-Frame-Options, Referrer-Policy,
    # Permissions-Policy, and (in production) Strict-Transport-Security -
    # see app/common/security_headers.py. Nginx does not need to
    # duplicate them; it only needs to get out of their way (avoid
    # `proxy_hide_header`/overriding them here).

    location /static/ {
        # Optional optimization: for higher-traffic deployments, mount the
        # same `app` static directory into Nginx and serve it directly
        # instead of proxying, per docs/DEPLOYMENT.md's "static assets may
        # be served by Nginx or Flask" guidance. Left proxied by default so
        # this file works with zero extra volume wiring.
        proxy_pass http://portfolio_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
    }
}
