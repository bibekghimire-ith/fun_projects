{% extends "admin/layout.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1>&gt; change password_</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if saved %}<p class="success">Password changed. Use it next time you log in.</p>{% endif %}
<form method="post" action="/admin/change-password" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>current password<input type="password" name="current_password" required></label>
  <label>new password (min. 8 characters)<input type="password" name="new_password" required minlength="8"></label>
  <label>confirm new password<input type="password" name="confirm_password" required minlength="8"></label>
  <button class="btn" type="submit">change password</button>
</form>
{% endblock %}
