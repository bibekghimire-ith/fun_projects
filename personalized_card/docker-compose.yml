services:
  postgres:
    image: postgres:16-alpine
    container_name: letter_postgres
    environment:
      POSTGRES_USER: letter
      POSTGRES_PASSWORD: letter
      POSTGRES_DB: letter_db
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U letter -d letter_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: letter_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: letter_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c " sleep 3; mc alias set local http://minio:9000 minioadmin minioadmin; mc mb -p local/letter-media || true; mc anonymous set download local/letter-media || true; exit 0; "

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: letter_api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://letter:letter@postgres:5432/letter_db
      JWT_SECRET: docker-jwt-secret-minimum-32-characters-here
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: docker-refresh-token-secret-min-32-ch
      REFRESH_TOKEN_EXPIRES_IN: 7d
      COOKIE_SECRET: docker-cookie-secret-minimum-32-chars
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_LOCAL_PATH: /app/uploads
      MAX_UPLOAD_SIZE_MB: 50
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: letter-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      APP_BASE_URL: http://${LAN_IP:-localhost}:4000
      WEB_BASE_URL: http://${LAN_IP:-localhost}:5173
      CORS_ORIGIN: http://${LAN_IP:-localhost}:5173
      RUN_SEED: "true"
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: letter_web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  uploads_data:
